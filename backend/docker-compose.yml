services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: careos
      POSTGRES_USER: careos
      POSTGRES_PASSWORD: careos_dev_password
    ports:
      - "5432:5432"
    volumes:
      - careos-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careos -d careos"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - careos-redis:/data

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: careos
      MINIO_ROOT_PASSWORD: careos_dev_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - careos-minio:/data

volumes:
  careos-postgres:
  careos-redis:
  careos-minio:
